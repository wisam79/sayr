pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    analyze:
      run: melos run analyze

pre-push:
  parallel: false
  commands:
    test:all:
      run: melos run test

commit-msg:
  commands:
    conventional:
      run: cz check --commit-msg-file {1}
