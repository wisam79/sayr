pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    analyze:
      run: melos run analyze:strict --no-select
      fail_text: "❌ Flutter analyze failed. Run 'melos run analyze:strict' to see errors."
    format:check:
      run: melos run format:check --no-select
      fail_text: "❌ Dart format check failed. Run 'melos run format' to fix."

pre-push:
  parallel: false
  commands:
    test:all:
      run: melos run test --no-select
      fail_text: "❌ Tests failed. Run 'melos run test' to see failures."
