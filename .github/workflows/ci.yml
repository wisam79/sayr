name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"
  DART_VERSION: "3.12.2"

jobs:
  analyze:
    name: Format + Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Verify formatting
        run: melos run format:check

      - name: Cache build_runner outputs
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/build/
            apps/mobile/.dart_tool/build/
            packages/core/.dart_tool/build/
            packages/data/.dart_tool/build/
          key: ${{ runner.os }}-build-runner-${{ hashFiles('**/pubspec.lock', '**/build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: melos run build:runner

      - name: Check for unstaged changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Running build_runner generated changes or untracked files that were not committed:"
            git status --porcelain
            exit 1
          fi

      - name: Run analyze (strict)
        run: melos run analyze:strict

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Cache build_runner outputs
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/build/
            apps/mobile/.dart_tool/build/
            packages/core/.dart_tool/build/
            packages/data/.dart_tool/build/
          key: ${{ runner.os }}-build-runner-${{ hashFiles('**/pubspec.lock', '**/build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: melos run build:runner

      - name: Run tests
        run: melos run test

  admin:
    name: Admin Lint & Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/admin
          npm ci

      - name: Run ESLint
        run: |
          cd apps/admin
          npm run lint

      - name: Build Check (TypeScript + Vite)
        run: |
          cd apps/admin
          npm run build
