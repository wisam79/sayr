name: Test Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.1"

permissions:
  contents: read
  actions: read

jobs:
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Run build_runner
        run: melos run build:runner

      - name: Run tests with coverage
        run: melos run test:coverage

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          find . -path ./.git -prune -o -name 'lcov.info' -print | while read -r f; do
            echo "Including $f"
            if [ -f coverage/lcov.info ]; then
              # Strip the closing line and append
              sed -e '$d' "$f" >> coverage/lcov.info
            else
              cp "$f" coverage/lcov.info
            fi
          done

      - name: Enforce minimum coverage (80% on domain + data)
        run: |
          # Filter to the layers AGENTS.md mandates ≥80% coverage on,
          # then enforce the threshold. lcov exits non-zero if coverage
          # falls below --fail-under, which fails this CI job.
          sudo apt-get install -y lcov
          lcov \
            --extract coverage/lcov.info \
              'packages/core/lib/*' \
              'packages/data/lib/*' \
            --output-file coverage/lcov.filtered.info
          COVERAGE_PCT=$(lcov --summary coverage/lcov.filtered.info | grep -oE 'lines\.\.\.\.\.\. [0-9.]+' | grep -oE '[0-9.]+')
          echo "Domain + data line coverage: ${COVERAGE_PCT}%"
          lcov --fail-under 80 --summary coverage/lcov.filtered.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: .
          flags: unittests
          fail_ci_if_error: true
          verbose: true
