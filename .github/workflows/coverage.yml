name: Test Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.1"

permissions:
  contents: read
  actions: read

jobs:
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Run build_runner
        run: melos run build:runner

      - name: Run tests with coverage
        run: melos run test:coverage

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          find . -path ./.git -prune -o -name 'lcov.info' -print | while read -r f; do
            echo "Including $f"
            if [ -f coverage/lcov.info ]; then
              # Strip the closing line and append
              sed -e '$d' "$f" >> coverage/lcov.info
            else
              cp "$f" coverage/lcov.info
            fi
          done

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: .
          flags: unittests
          fail_ci_if_error: false
          verbose: true
