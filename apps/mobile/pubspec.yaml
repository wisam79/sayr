name: sayr_mobile
description: Sayr v3 - Mobile app for Iraqi university transit
version: 3.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  awesome_notifications: ^0.10.0
  bloc: ^8.1.4
  cached_network_image: ^3.4.1
  chat_bubbles: ^1.6.0
  connectivity_plus: ^6.0.5
  dio: ^5.7.0
  equatable: ^2.0.5
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flash: ^3.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10
  fpdart: ^1.1.0
  freezed_annotation: ^3.0.0
  geolocator: ^13.0.0
  get_it: ^7.7.0
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  injectable: ^2.4.4
  intl: ^0.20.2
  latlong2: ^0.9.1
  logger: ^2.4.0
  maplibre_gl: ^0.22.0
  package_info_plus: ^8.0.2
