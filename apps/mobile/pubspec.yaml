name: sayr_mobile
description: Sayr v3 - Mobile app for Iraqi university transit
version: 3.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  awesome_notifications: ^0.10.0
  bloc: ^8.1.4
  bloc_concurrency: ^0.2.5
  cached_network_image: ^3.4.1
  chat_bubbles: ^1.6.0
  connectivity_plus: ^6.0.5
  dio: ^5.7.0
  equatable: ^2.0.5
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flash: ^3.1.1
  flutter:
    sdk: flutter
  flutter_ble_peripheral: ^2.1.1
  flutter_bloc: ^8.1.6
  flutter_blue_plus: ^1.31.0
  flutter_localizations:
    sdk: flutter
  flutter_slidable: ^3.1.1
  flutter_svg: ^2.0.10
  flutter_swipe_button: ^2.1.1
  fpdart: ^1.1.0
  freezed_annotation: ^3.0.0
  geolocator: ^13.0.0
  get_it: ^7.7.0
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  injectable: ^2.4.4
  intl: ^0.20.2
  latlong2: ^0.9.1
  logger: ^2.4.0
  lottie: ^3.1.2
  maplibre_gl: ^0.22.0
  mobile_scanner: ^7.2.0
  package_info_plus: ^8.0.2
  permission_handler: ^11.3.1
  pretty_qr_code: ^3.5.0
  retry: ^3.1.2
  sayr_core:
    path: ../../packages/core
  sayr_data:
    path: ../../packages/data
  sayr_ui_kit:
    path: ../../packages/ui_kit
  sentry_flutter: ^8.8.0
  skeletonizer: ">=2.0.0 <2.1.2"
  stream_transform: ^2.1.1
  talker_bloc_logger: ^4.6.4
  talker_flutter: ^4.9.3
  url_launcher: ^6.3.1
  workmanager: ^0.9.0

dev_dependencies:
  bloc_test: ^9.1.7
  build_runner: ^2.4.13
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  functions_client: ^2.5.0
  injectable_generator: ^2.6.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  patrol: ^3.7.0
  supabase_flutter: ^2.5.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
    - assets/google_fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 24
