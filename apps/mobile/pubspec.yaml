name: sayr_mobile
description: Sayr v3 - Mobile app for Iraqi university transit
version: 3.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sayr_core:
    path: ../../packages/core
  sayr_data:
    path: ../../packages/data
  sayr_ui_kit:
    path: ../../packages/ui_kit

  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5
  go_router: ^14.2.7
  get_it: ^7.7.0
  injectable: ^2.4.4
  fpdart: ^1.1.0
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  sentry_flutter: ^8.8.0
  maplibre_gl: ^0.22.0
  awesome_notifications: ^0.10.0
  geolocator: ^13.0.0
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.2
  flash: ^3.1.1
  skeletonizer: ^2.1.3
  retry: ^3.1.2
  talker_flutter: ^4.9.3
  chat_bubbles: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.4.13
  mocktail: ^1.0.4
  bloc_test: ^9.1.7
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
